spring:
  datasource:
    url: jdbc:h2:mem:healthdekho;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  ai:
    openai:
      api-key: test-key
healthdekho:
  jwt:
    secret: test-secret-must-be-at-least-thirty-two-bytes-long
    expiration-seconds: 3600
  ai:
    enabled: false
