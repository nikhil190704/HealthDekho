spring:
  application:
    name: healthdekho-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DB_USERNAME:healthdekho}
    password: ${DB_PASSWORD:healthdekho}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
healthdekho:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  ai:
    enabled: ${AI_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
